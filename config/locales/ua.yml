ua:
  system:
    unknown_role: "\nНевідома роль користувача\n\n"
    exit_message: "Дякуємо, звертайтеся до нас ще!\n\n\n"
    user_not_found: |

      --------------------------------------------
           Невірний номер телефону або пароль     
      --------------------------------------------

  auth:
    login:
      prompt_phone: "Введіть номер телефону:"
      prompt_password: "Введіть пароль:"
    signup:
      prompt_username: "Введіть ваш юзернейм:"
      prompt_phone: "Введіть ваш номер телефону:"
      prompt_password: "Придумайте пароль:"
      phone_exists: "Помилка: Користувач із телефоном %{phone} вже зареєстрований!"
      registering: "--- Реєструємо... ---"
      success: "Користувач %{name} успішно зареєстрований!\n\n"

  user:
    main: |
      Вітаємо у магазині PrintForge!

      Різноманітні 3D-моделі та матеріали на ваш смак
      Звертайтесь до PrintForge!

      Оберіть дію:
        1 - увійти у акаунт
        2 - зареєструватися
        3 - змінити мову на англійську
        4 - вийти

    store_menu:
      greeting: "Вітаємо, %{username}!"
      body: |
        Вітаємо у магазині PrintForge!

        Оберіть дію та введіть її номер:
        1. Переглянути каталог моделей
        2. Переглянути каталог матеріалів
        3. Зібрати товар і додати в кошик
        4. Переглянути кошик та оформити замовлення (%{count} тов.)
        5. Вийти в головне меню (змінити акаунт)
      prompt: "Ваш вибір: "
      invalid_action: "\n[!] Невідома дія, введіть число від 1 до 5."

    catalog:
      models_header: "\n--- КАТАЛОГ МОДЕЛЕЙ ---"
      model_item: "ID: %{id} | Назва: %{title} | Базова ціна: %{price} грн"
      materials_header: "\n--- КАТАЛОГ МАТЕРІАЛІВ ---"
      material_item: "ID: %{id} | Назва: %{name} | Доплата: %{price} грн"
      press_enter: "\nНатисніть Enter, щоб повернутися в меню..."

    add_to_cart:
      header: "--- ДОДАВАННЯ ДО КОШИКА ---"
      prompt_model: "Введіть ID моделі (або 'back' для виходу): "
      model_not_found: "\n[!] Помилка: Модель з таким ID не знайдена!"
      prompt_material: "Введіть ID матеріалу: "
      material_not_found: "\n[!] Помилка: Матеріал з таким ID не знайдено!"
      prompt_color: "Введіть колір товару: "
      prompt_size: "Введіть розмір (наприклад, S, M, L): "
      summary: |
        ----------------------------------------
        Ви обрали:
        Модель: %{model_title} (%{model_price} грн)
        Матеріал: %{material_name} (+%{material_price} грн)
        Колір: %{color} | Розмір: %{size}
        ----------------------------------------
      prompt_quantity: "Введіть кількість: "
      invalid_quantity: "\n[!] Помилка: Кількість має бути більше 0!"
      success: "\n[✓] Успішно додано до кошика!"

    cart:
      empty: "Ваш кошик порожній."
      header: "--- ВАШ КОШИК ---"
      item_details: |
        %{index}. Модель: %{model} | Матеріал: %{material}
           Колір: %{color} | Розмір: %{size} | Кількість: %{quantity} шт.
           Сума: %{subtotal} грн
        ----------------------------------------
      total_sum: "ЗАГАЛЬНА СУМА КОШИКА: %{total} грн"
      actions: |
        ========================================
        Дії:
        1. Оформити замовлення
        2. Видалити товар з кошика за номером
        3. Повернутися в меню
      prompt_action: "Оберіть дію: "
      order_success: |

        [✓] Замовлення успішно оформлено!
        Дякуємо за покупку в PrintForge!
      prompt_delete_index: "Введіть номер товару для видалення: "
      item_deleted: "\n[!] Товар '%{model}' видалено з кошика."
      invalid_index: "\n[!] Невірний номер товару."
      invalid_action: "\n[!] Невідома дія."

  admin:
    greeting: |
      Вхід у режим адміністратора...
      Успішний вхід як 'admin'.
      %{name} тепер може керувати програмою

    main_menu:
      greeting: "\n\nВітаємо, %{name}!"
      body: |
        Оберіть дію:
          1 - переглянути усі замовлення
          2 - зміна статусів замовлення
          3 - повернутись у головне меню
      leaving: "Вихід з режиму адміністратора...\n\n\n"

    status_menu:
      body: |



        Меню зміни статусів замовлень.
        Оберіть дію:
          1 - статуси замовлень
          2 - зміна статусів
          3 - повернення до панелі адміністратора
      returning: "Повернення до панелі адміністратора...\n\n\n"

    statuses:
      new: "Нове"
      printing: "Друкується"
      ready: "Готове"

    orders:
      empty: "На жаль, замовлень від користувачів ще немає."
      full_table:
        title: "Повний список замовлень"
        headings:
          - "ID замовлення"
          - "ID юзера"
          - "Колір"
          - "Розмір"
          - "Кількість"
          - "Фінальна ціна"
          - "Статус"
      short_table:
        title: "Зручний та короткий список статусів замовлень"
        headings:
          - "ID замовлення"
          - "Вартість"
          - "Статус"

    change_status:
      prompt_id: "\n\n\nОберіть замовлення по його id:"
      order_found: "\n\nЗамовлення з ID %{id} знайдено."
      order_not_found: "Замовлення з таким ID не знайдено."
      current_status: "\nПоточний статус замовлення: %{status}"
      no_actions: "Для статусу '%{status}' немає доступних дій."
      confirm_prompt: "\nПеревести замовлення у статус %{new_status}?\n\n(yes/no)"
      success: "Статус успішно змінено на %{new_status}!"
      cancelled: "Зміну статусу скасовано."
